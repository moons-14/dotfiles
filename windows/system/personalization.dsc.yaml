$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: Use dark app mode
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
      valueName: AppsUseLightTheme
      valueData:
        DWord: 0
      _exist: true
  - name: Use dark Windows mode
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
      valueName: SystemUsesLightTheme
      valueData:
        DWord: 0
      _exist: true
  - name: Choose accent color automatically
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Control Panel\Desktop
      valueName: AutoColorization
      valueData:
        DWord: 1
      _exist: true
  - name: Disable rotating lock screen
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
      valueName: RotatingLockScreenEnabled
      valueData:
        DWord: 0
      _exist: true
  - name: Disable lock screen facts and tips
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
      valueName: RotatingLockScreenOverlayEnabled
      valueData:
        DWord: 0
      _exist: true
  - name: Disable lock screen slideshow
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
      valueName: SlideshowEnabled
      valueData:
        DWord: 0
      _exist: true
  - name: Do not automatically select lock screen widgets
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Lock Screen
      valueName: AutoSelectWidgetsOnLockScreen
      valueData:
        DWord: 0
      _exist: true
  - name: Clear selected lock screen status
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Lock Screen\FeedManager\Selected
      _exist: false
