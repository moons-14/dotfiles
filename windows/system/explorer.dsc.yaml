$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: Show file extensions
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: HideFileExt
      valueData:
        DWord: 0
      _exist: true

  - name: Show hidden files
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Hidden
      valueData:
        DWord: 1
      _exist: true

  - name: Show protected operating system files
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: ShowSuperHidden
      valueData:
        DWord: 1
      _exist: true

  - name: Show full path in title bar
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState
      valueName: FullPath
      valueData:
        DWord: 1
      _exist: true

  - name: Show empty drives
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: HideDrivesWithNoMedia
      valueData:
        DWord: 0
      _exist: true
