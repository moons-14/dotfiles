$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: Disable advertising ID by policy
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\AdvertisingInfo
      valueName: DisabledByGroupPolicy
      valueData:
        DWord: 1
      _exist: true

  - name: Disable Windows consumer experiences
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\CloudContent
      valueName: DisableWindowsConsumerFeatures
      valueData:
        DWord: 1
      _exist: true

  - name: Set diagnostic data to the lowest available level
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\DataCollection
      valueName: AllowTelemetry
      valueData:
        DWord: 0
      _exist: true

  - name: Disable feedback notifications
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\DataCollection
      valueName: DoNotShowFeedbackNotifications
      valueData:
        DWord: 1
      _exist: true

  - name: Disable Diagnostic Data Viewer
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\DataCollection
      valueName: DisableDiagnosticDataViewer
      valueData:
        DWord: 1
      _exist: true

  - name: Limit diagnostic log collection
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\DataCollection
      valueName: LimitDiagnosticLogCollection
      valueData:
        DWord: 1
      _exist: true

  - name: Limit diagnostic dump collection
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\DataCollection
      valueName: LimitDumpCollection
      valueData:
        DWord: 1
      _exist: true

  - name: Disable activity feed
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\System
      valueName: EnableActivityFeed
      valueData:
        DWord: 0
      _exist: true

  - name: Disable publishing user activity
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\System
      valueName: PublishUserActivities
      valueData:
        DWord: 0
      _exist: true

  - name: Disable uploading user activity
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Policies\Microsoft\Windows\System
      valueName: UploadUserActivities
      valueData:
        DWord: 0
      _exist: true
