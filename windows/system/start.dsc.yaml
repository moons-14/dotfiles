$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: Show recently added apps
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Start
      valueName: ShowRecentList
      valueData:
        DWord: 1
      _exist: true
  - name: Hide recommended and recent files
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Start_TrackDocs
      valueData:
        DWord: 0
      _exist: true
  - name: Hide recommendations for tips and new apps
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Start_IrisRecommendations
      valueData:
        DWord: 0
      _exist: true
  - name: Disable app launch tracking
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Start_TrackProgs
      valueData:
        DWord: 0
      _exist: true
