$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: Disable development usage
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\CloudExperienceHost\Intent\developer
      valueName: Intent
      valueData:
        DWord: 0
      _exist: true

  - name: Clear development priority
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\CloudExperienceHost\Intent\developer
      valueName: Priority
      valueData:
        DWord: 0
      _exist: true

