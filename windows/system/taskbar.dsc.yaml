$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: Taskbar Widgets
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: TaskbarDa
      valueData:
        DWord: 0
      _exist: true
  - name: Taskbar Resume
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: IsEnabled
      valueData:
        DWord: 0
      _exist: true
  - name: Taskbar Search
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Search
      valueName: SearchboxTaskbarMode
      valueData:
        DWord: 1
      _exist: true
  - name: Taskbar Alignment
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: TaskbarAl
      valueData:
        DWord: 0
      _exist: true
