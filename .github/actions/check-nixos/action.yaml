# Reference: https://github.com/ryoppippi/dotfiles/blob/main/.github/workflows/nix-build.yaml
name: Build Linux checks
description: Build every x86_64-linux flake check in parallel
runs:
  using: composite
  steps:
    - name: Build all Linux checks
      shell: bash
      run: |
        set -euo pipefail
        nix run .#nix-fast-build -- \
          --flake .#checks.x86_64-linux \
          --skip-cached \
          --no-nom \
          --no-link
